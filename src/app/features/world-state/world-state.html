<div class="dashboard-wrapper">
  @for (colIdx of columnIndices; track colIdx) {
    <div class="silo">
      @for (id of getColWidgets(colIdx); track id) {
        @switch (id) {
          @case ("alerts") {
            <app-alerts />
          }
          @case ("vendors") {
            <app-vendors />
          }
          @case ("calendar") {
            <app-calendar-1999 />
          }
          @case ("archimedeas") {
            <app-archimedea-list />
          }
          @case ("invasions") {
            <app-invasions />
          }
          @case ("fissures") {
            <app-fissures />
          }
        }
      }
    </div>
  }
</div>

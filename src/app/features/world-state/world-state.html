<div class="dashboard-wrapper">
  @for (colIdx of columnIndices; track colIdx) {
    <div class="silo">
      @for (id of getColWidgets(colIdx); track id) {
        @switch (id) {
          @case ("alerts") {
            <app-alerts />
          }
          @case ("events") {
            <app-events />
          }
          <!-- TODO: add list of weekly kuva vendors? -->
          <!-- TODO: add list of Acrithis? -->
          @case ("vendors") {
            <app-vendors />
          }
          @case ("calendar") {
            <app-calendar-1999 />
          }
          @case ("archimedeas") {
            <app-archimedeas />
          }
          @case ("invasions") {
            <app-invasions />
          }
          @case ("fissures") {
            <app-fissures />
          }

          <!-- TODO: Section with weekly reset stuff reminder (Iron Wake Shop, Yonta Kuva) -->
        }
      }
    </div>
  }
</div>
